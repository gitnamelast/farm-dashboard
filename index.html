<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Farm Erichsfelde</title>
<style>
  :root {
    --bg:        #0f1410;
    --surface:   #161d18;
    --border:    #2a3a2d;
    --text:      #e8ede9;
    --muted:     #7a9480;
    --accent:    #6db87a;
    --accent2:   #d4a843;
    --red:       #e05c5c;
    --orange:    #d97706;
    --blue:      #5b9bd5;
    --farm:      #6db87a;
    --haus:      #a78bfa;
    --angest:    #f59e0b;
    --allg:      #60a5fa;
    --arbeit:    #f472b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* LOGIN */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: var(--bg);
  }
  .login-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 48px; text-align: center;
    width: 360px; max-width: 95vw;
  }
  .login-box h1 { color: var(--accent); font-size: 1.6rem; margin-bottom: 6px; }
  .login-box p { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
  .login-box input {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 1rem; margin-bottom: 12px; outline: none;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: var(--accent); color: #0f1410; font-size: 1rem;
    font-weight: 600; cursor: pointer; margin-bottom: 12px;
  }
  .login-box button:hover { opacity: .85; }
  .login-error { color: var(--red); font-size: .8rem; min-height: 20px; }

  /* HEADER */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .farm-title { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
  .header-meta { font-size: .72rem; color: var(--muted); }
  #app { display: none; }

  /* MAIN */
  .main { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }
  .grid-full { margin-bottom: 20px; }

  /* CARD */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; margin-bottom: 20px;
  }
  .card-body { padding: 16px 20px; }

  /* TABS */
  .tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 12px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 6px 14px; border-radius: 6px; font-size: .82rem;
    cursor: pointer; transition: all .2s; font-weight: 500;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted);
  }
  .tab.active { background: var(--accent); color: #0f1410; border-color: var(--accent); font-weight: 600; }
  .tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  /* TASKS */
  .task-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .task-item:last-child { border-bottom: none; }
  .prio-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .prio-1 { background: var(--red); }
  .prio-2 { background: var(--orange); }
  .prio-3 { background: var(--accent2); }
  .prio-4 { background: var(--muted); }
  .prio-5 { background: #444; }
  .task-title { font-size: .9rem; font-weight: 500; }
  .task-meta { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .task-meta span { margin-right: 10px; }

  /* STATUS */
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.online { background: var(--accent); }
  .status-dot.offline { background: var(--red); }
  .status-row { display: flex; justify-content: space-between; font-size: .82rem; padding: 4px 0; }
  .status-row span:first-child { color: var(--muted); }

  /* MACHINES */
  .machine-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .machine-item:last-child { border-bottom: none; }
  .machine-name { font-size: .88rem; font-weight: 500; }
  .machine-sub { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .machine-status { font-size: .72rem; color: var(--muted); }

  /* WEATHER */
  .wetter-card { display: flex; align-items: center; gap: 16px; padding: 12px 0; }
  .wetter-gross { font-size: 3rem; }
  .wetter-info .wtemp { font-size: 1.6rem; font-weight: 700; }
  .wetter-info .wdesc { color: var(--muted); font-size: .85rem; }
  .forecast { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .forecast-day {
    flex: 1; min-width: 60px; text-align: center; padding: 8px 4px;
    background: var(--bg); border-radius: 8px; border: 1px solid var(--border);
  }
  .day-name { font-size: .72rem; color: var(--muted); }
  .day-max { font-size: .9rem; font-weight: 700; margin-top: 2px; }
  .day-min { font-size: .75rem; color: var(--muted); }

  /* IRRIGATION */
  .irr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .irr-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
  }
  .irr-name { font-size: .82rem; }
  .irr-date { font-size: .7rem; color: var(--muted); }

  /* HUNDE */
  .dog-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 12px;
  }
  .dog-card:last-child { margin-bottom: 0; }
  .dog-name { font-size: 1rem; font-weight: 600; }
  .dog-meta { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .behandlung-table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 8px; }
  .behandlung-table th { text-align: left; color: var(--muted); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--border); }
  .behandlung-table td { padding: 4px 8px 4px 0; color: var(--text); }

  /* KALENDER */
  .kal-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-bottom: 1px solid var(--border);
  }
  .kal-item:last-child { border-bottom: none; }
  .kal-title { font-size: .85rem; flex: 1; }

  /* JAHRESPLANUNG */
  .jp-tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .jp-tab {
    padding: 6px 12px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; font-size: .82rem;
    transition: all .2s;
  }
  .jp-tab.active {
    background: var(--accent); color: #0f1410;
    border-color: var(--accent); font-weight: 600;
  }
  .jp-cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .jp-col {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px;
  }
  .jp-col h3 {
    font-size: .9rem; font-weight: 600;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .jp-item {
    padding: 6px 0; border-bottom: 1px solid var(--border);
    font-size: .8rem; line-height: 1.4; color: var(--text);
  }
  .jp-item:last-child { border-bottom: none; }
  .jp-item.done { color: var(--muted); text-decoration: line-through; }
  .jp-add-btn {
    margin-top: 10px; width: 100%; padding: 6px;
    border-radius: 6px; border: 1px dashed var(--border);
    background: transparent; color: var(--muted);
    cursor: pointer; font-size: .78rem;
    transition: all .2s;
  }
  .jp-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .jp-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 999;
    align-items: center; justify-content: center;
  }
  .jp-modal.show { display: flex; }
  .jp-modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; width: 400px; max-width: 95vw;
  }
  .jp-modal-box h3 { margin-bottom: 16px; font-size: 1rem; }
  .jp-modal-box textarea {
    width: 100%; min-height: 80px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: .85rem; padding: 8px; resize: vertical;
  }
  .jp-modal-box textarea:focus { outline: none; border-color: var(--accent); }
  .jp-modal-actions {
    display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end;
  }
  .jp-modal-actions button {
    padding: 7px 16px; border-radius: 6px; border: none;
    cursor: pointer; font-size: .85rem; font-weight: 600;
  }
  .jp-modal-actions .jp-save { background: var(--accent); color: #0f1410; }
  .jp-modal-actions .jp-cancel { background: var(--border); color: var(--text); }
  @media (max-width: 900px) {
    .jp-cols { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .jp-cols { grid-template-columns: 1fr; }
    .jp-tabs { justify-content: center; }
  }

  /* EMPTY */
  .empty { color: var(--muted); font-size: .85rem; text-align: center; padding: 12px 0; }

  /* MOBILE */
  @media (max-width: 768px) {
    .header { padding: 12px 16px; }
    .farm-title { font-size: 1.1rem; }
    .main { padding: 12px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .header-meta { display: none; }
  }
  @media (max-width: 480px) {
    .irr-grid { grid-template-columns: 1fr 1fr; }
    .login-box { width: 90%; padding: 32px 24px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>Erichsfelde</h1>
    <p>Farm Manager Dashboard</p>
    <input type="password" id="pw-input" placeholder="Passwort" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Anmelden</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="farm-title">🌿 Erichsfelde</div>
    <div class="header-meta" id="header-meta">
      <span id="export-time"></span> · <span id="app-version"></span>
    </div>
  </div>

  <div class="main">

    <!-- ROW 1 -->
    <div class="grid-2">

      <!-- LINKS: Aufgaben -->
      <div class="card">
        <div class="card-body">
          <div class="tabs">
          </div>
          <div id="tasks-heute"></div>
        </div>
      </div>

      <!-- STATUS -->
      <div class="card">
        <div class="card-body" id="status-body"></div>
      </div>

    </div>

    <!-- ROW 2 -->
    <div class="grid-2">

      <!-- WETTER -->
      <div class="card">
        <div class="card-body" id="wetter-body"></div>
      </div>

      <!-- WINDMOTOREN -->
      <div class="card">
        <div class="card-body">
          <div id="windmotoren-body"></div>
        </div>
      </div>

    </div>

    <!-- ROW 3 -->
    <div class="grid-3">

      <!-- FAHRZEUGE -->
      <div class="card">
        <div class="card-body">
          <div id="fahrzeuge-body"></div>
        </div>
      </div>

      <!-- BEWÄSSERUNG -->
      <div class="card">
        <div class="card-body">
          <div id="bewaesserung-body"></div>
        </div>
      </div>

      <!-- HUNDE -->
      <div class="card">
        <div class="card-body" id="hunde-body"></div>
      </div>

    </div>

    <!-- ROW 4: Kalender -->
    <div class="grid-full">
      <div class="card">
        <div class="card-body" id="kalender-body"></div>
      </div>
    </div>

    <!-- ROW 5: Jahresplanung -->
    <div class="grid-full">
      <div class="card">
        <div class="card-body">
          <div class="jp-tabs" id="jp-tabs"></div>
          <div class="jp-cols" id="jp-cols"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal: Notiz hinzufügen -->
<div class="jp-modal" id="jp-modal">
  <div class="jp-modal-box">
    <h3 id="jp-modal-title">Notiz hinzufügen</h3>
    <textarea id="jp-note-input" placeholder="Notiz..."></textarea>
    <div class="jp-modal-actions">
      <button class="jp-cancel" onclick="closeJpModal()">Abbrechen</button>
      <button class="jp-save" onclick="saveJpNote()">Speichern</button>
    </div>
  </div>
</div>

<script>
const APP_VERSION = 'v2.0';
let dashData = null;

async function sha256(msg) {
  const msgUtf8 = new TextEncoder().encode(msg);
  const hashBuf = await crypto.subtle.digest('SHA-256', msgUtf8);
  const hashArr = Array.from(new Uint8Array(hashBuf));
  return hashArr.map(b => b.toString(16).padStart(2,'0')).join('');
}

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  if (!pw) return;
  const hash = await sha256(pw);
  if (hash !== 'c8e02b8c191ea69a0bf9713d3c3dd0d10e6b3b3a7f9e4c9e0e8c9c9c9c9c9c') {
    document.getElementById('login-error').textContent = 'Falsches Passwort';
    return;
  }
  localStorage.setItem('eri_auth', hash);
  showApp();
}


function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderAll();
}

async function loadData() {
  try {
    const r = await fetch('./data.json');
    dashData = await r.json();
  } catch(e) {
    console.warn('fetch failed, trying localStorage fallback');
    const raw = localStorage.getItem('eri_data');
    if (raw) dashData = JSON.parse(raw);
  }
  const saved = localStorage.getItem('eri_auth');
  if (saved) {
    showApp();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
  }
}

function renderAll() {
  renderHeader();
  renderTasks();
  renderWetter();
  renderWindmotoren();
  renderFahrzeuge();
  renderBewaesserung();
  renderHunde();
  renderKalender();
  renderJahresplanung(dashData);
}

function renderHeader() {
  const exp = dashData.exportiert_am;
  const d = new Date(exp);
  const fmt = d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('export-time').textContent = 'Stand: ' + fmt;
  document.getElementById('app-version').textContent = APP_VERSION;
}

const m = {
  'Farm':'kat-farm','Haus':'kat-haus','Angestellte':'kat-angest',
  'Allgemein':'kat-allg','Arbeit':'kat-arbeit',
  'Farm:':'.kat-farm','Haus:':'.kat-haus','Angestellte:':'.kat-angest',
  'Allgemein:':'.kat-allg','Arbeit:':'.kat-arbeit'
};
function katClass(k) {
  return m[k] || 'kat-default';
}
function katLabel(k) {
  return m[k] || k || '—';
}
function besitzerLabel(b) {
  const icons = { 'Erich': '🧑‍🌾', 'Sarah': '👩‍🌾', 'Felix': '👨‍🌾', 'Anna': '👩‍🌾' };
  return icons[b] || '👤';
}
function fmtDate(s) {
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit'});
}
function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function taskHtml(tasks) {
  const shown = tasks.slice(0, 20);
  let html = shown.map(t => `
    <div class="task-item">
      <div class="prio-dot prio-${t.prioritaet}"></div>
      <div style="flex:1">
        <div class="task-title">${esc(t.titel)}</div>
        <div class="task-meta">
          <span>${fmtDate(t.faellig)}</span>
          <span>${besitzerLabel(t.besitzer)}</span>
        </div>
      </div>
    </div>`).join('');
  return html;
}

function renderTasks() {
  const tabsEl = document.querySelector('.tabs');
  const heute = dashData.aufgaben || [];
  tabsEl.innerHTML = `<div class="tab active">Heute</div>`;
  document.getElementById('tasks-heute').innerHTML = taskHtml(heute);
}

function switchTab(which) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tasks-heute').innerHTML = taskHtml(dashData.aufgaben || []);
}

function wIcon(wcode, rain) {
  if (rain > 5) return '🌧';
  if (rain > 0) return '🌦';
  if (wcode >= 3) return '☁️';
  if (wcode === 2) return '⛅';
  return '☀️';
}
function wochentag(ds) {
  const t = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  return t[new Date(ds+'T00:00:00').getDay()];
}

function renderWetter() {
  const w = dashData.wetter.aktuell;
  document.getElementById('wetter-body').innerHTML = `
    <div class="wetter-card">
      <div class="wetter-gross">${wIcon(w.wettercode, w.niederschlag)}</div>
      <div class="wetter-info">
        <div class="wtemp">${w.temperatur}°</div>
        <div class="wdesc">${esc(w.beschreibung)}</div>
      </div>
    </div>
    <div class="forecast">
      ${(dashData.wetter.vorhersage || []).slice(0,5).map(f => `
        <div class="forecast-day">
          <div class="day-name">${wochentag(f.date)}</div>
          <div class="day-max">${f.temp_max}°</div>
          <div class="day-min">${f.temp_min}°</div>
        </div>`).join('')}
    </div>`;
}

function renderWindmotoren() {
  const items = dashData.windmotoren || [];
  document.getElementById('windmotoren-body').innerHTML = items.map(m => `
    <div class="machine-item">
      <div>
        <div class="machine-name">${esc(m.name)}</div>
        <div class="machine-sub">${m.leistung||''}</div>
      </div>
      <div class="machine-status">${m.status||'—'}</div>
    </div>`).join('');
}

function renderFahrzeuge() {
  const items = dashData.fahrzeuge || [];
  document.getElementById('fahrzeuge-body').innerHTML = items.map(v => `
    <div class="machine-item">
      <div>
        <div class="machine-name">${esc(v.name)}</div>
        <div class="machine-sub">${v.typ||''}</div>
      </div>
    </div>`).join('');
}

function renderBewaesserung() {
  const items = dashData.bewaesserung || [];
  document.getElementById('bewaesserung-body').innerHTML =
    `<div class="irr-grid">` +
    items.map(p => `
      <div class="irr-item">
        <div class="irr-name">${esc(p.name)}</div>
        <div class="irr-date">${fmtDate(p.letzte_bewaesserung)}</div>
      </div>`).join('') +
    `</div>`;
}

function renderHunde() {
  const hunde = dashData.hunde || [];
  document.getElementById('hunde-body').innerHTML = hunde.map(h => {
    const behandlungen = h.behandlungen || [];
    const letzte4 = behandlungen.slice(0, 4);
    let behandlungHtml = '';
    if (letzte4.length) {
      behandlungHtml = `
        <table class="behandlung-table">
          <thead><tr>
            <th>Datum</th>
            <th>Behandlung</th>
            <th>Mittel</th>
            <th>Lot-Nr</th>
          </tr></thead>
          <tbody>
            ${letzte4.map(b => `<tr>
              <td>${fmtDate(b.datum)}</td>
              <td>${esc(b.behandlungsart)}</td>
              <td>${esc(b.mittel||'—')}</td>
              <td>${esc(b.lot_nummer||'—')}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    } else {
      behandlungHtml = `<div class="empty">Keine Behandlungen</div>`;
    }
    return `
      <div class="dog-card">
        <div class="dog-name">${esc(h.name)}</div>
        <div class="dog-meta">${esc(h.rasse||'')} · ${esc(h.alter||'')}</div>
        ${behandlungHtml}
      </div>`;
  }).join('');
}

function renderKalender() {
  const items = dashData.kalender || [];
  const grouped = {};
  items.forEach(e => {
    const d = fmtDate(e.datum);
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(e);
  });
  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">';
  Object.keys(grouped).sort().forEach(datum => {
    html += `<div>
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:4px">${datum}</div>
      ${grouped[datum].map(e => `<div class="kal-item"><span class="kal-title">${esc(e.titel)}</span></div>`).join('')}
    </div>`;
  });
  html += '</div>';
  document.getElementById('kalender-body').innerHTML = html;
}

// ============================================================
// JAHRESPLANUNG v2.0
// ============================================================
const MONTHS = [
  { key: 'jan', label: 'Jan', icon: '❄️' },
  { key: 'feb', label: 'Feb', icon: '🌨' },
  { key: 'mar', label: 'Mär', icon: '🌷' },
  { key: 'apr', label: 'Apr', icon: '🌱' },
  { key: 'mai', label: 'Mai', icon: '🌾' },
  { key: 'jun', label: 'Jun', icon: '☀️' },
  { key: 'jul', label: 'Jul', icon: '🌻' },
  { key: 'aug', label: 'Aug', icon: '🌻' },
  { key: 'sep', label: 'Sep', icon: '🍂' },
  { key: 'okt', label: 'Okt', icon: '🍁' },
  { key: 'nov', label: 'Nov', icon: '🌧' },
  { key: 'dez', label: 'Dez', icon: '🎄' },
];

let activeMonth = MONTHS[new Date().getMonth()].key;
let _jpEditing = { group: null, idx: null };

function renderJahresplanung(data) {
  if (!data || !data.jahresplanung) {
    document.getElementById('jp-tabs').innerHTML = '<div class="empty">Keine Jahresplandaten vorhanden</div>';
    document.getElementById('jp-cols').innerHTML = '';
    return;
  }
  window._jpData = data.jahresplanung;
  const tabs = document.getElementById('jp-tabs');
  tabs.innerHTML = MONTHS.map(m =>
    `<button class="jp-tab${m.key === activeMonth ? ' active' : ''}" onclick="selectMonth('${m.key}')">${m.icon} ${m.label}</button>`
  ).join('');
  renderMonth(data.jahresplanung, activeMonth);
}

function selectMonth(key) {
  activeMonth = key;
  if (window._jpData) renderMonth(window._jpData, key);
  document.querySelectorAll('.jp-tab').forEach(t => {
    t.classList.toggle('active', t.textContent.includes(MONTHS.find(m=>m.key===key).label));
  });
}

function renderMonth(jp, key) {
  const cols = document.getElementById('jp-cols');
  const m = jp[key] || {};
  const groups = [
    { title: '🐄 Rinder', key: 'rinder', data: m.rinder || [] },
    { title: '🌿 Weide', key: 'weide', data: m.weide || [] },
    { title: '🏠 Haus & Hof', key: 'haus_hof', data: m.haus_hof || [] },
  ];
  cols.innerHTML = groups.map(g => `
    <div class="jp-col">
      <h3>${g.title}</h3>
      ${g.data.length
        ? g.data.map((item, i) => `
            <div class="jp-item${item.done ? ' done' : ''}" onclick="toggleJpDone('${g.key}', ${i})">
              ${esc(item.text)}
            </div>`).join('')
        : '<div class="jp-item" style="color:var(--muted)">— keine Einträge —</div>'
      }
      <button class="jp-add-btn" onclick="openJpModal('${g.key}', -1)">+ Notiz</button>
    </div>`
  ).join('');
}

function toggleJpDone(groupKey, idx) {
  if (!window._jpData) return;
  const month = window._jpData[activeMonth];
  if (!month || !month[groupKey]) return;
  month[groupKey][idx].done = !month[groupKey][idx].done;
  // Persist to localStorage
  const saved = JSON.parse(localStorage.getItem('eri_jp') || '{}');
  if (!saved[activeMonth]) saved[activeMonth] = {};
  if (!saved[activeMonth][groupKey]) saved[activeMonth][groupKey] = [];
  saved[activeMonth][groupKey] = month[groupKey];
  localStorage.setItem('eri_jp', JSON.stringify(saved));
  renderMonth(window._jpData, activeMonth);
}

function openJpModal(groupKey, idx) {
  _jpEditing = { group: groupKey, idx };
  document.getElementById('jp-note-input').value = '';
  document.getElementById('jp-modal-title').textContent = 'Notiz hinzufügen';
  document.getElementById('jp-modal').classList.add('show');
  setTimeout(() => document.getElementById('jp-note-input').focus(), 50);
}

function closeJpModal() {
  document.getElementById('jp-modal').classList.remove('show');
  _jpEditing = { group: null, idx: null };
}

function saveJpNote() {
  const text = document.getElementById('jp-note-input').value.trim();
  if (!text) return;
  if (!window._jpData) return;
  const month = window._jpData[activeMonth];
  if (!month) return;
  const group = month[_jpEditing.group] || [];
  group.push({ text, done: false });
  month[_jpEditing.group] = group;
  // Persist
  const saved = JSON.parse(localStorage.getItem('eri_jp') || '{}');
  if (!saved[activeMonth]) saved[activeMonth] = {};
  saved[activeMonth][_jpEditing.group] = group;
  localStorage.setItem('eri_jp', JSON.stringify(saved));
  closeJpModal();
  renderMonth(window._jpData, activeMonth);
}

// Close modal on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeJpModal();
});

loadData();
</script>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Erichsfelde</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f1410;
    --surface:   #161d18;
    --border:    #2a3a2d;
    --text:      #e8ede9;
    --muted:     #7a9480;
    --accent:    #6db87a;
    --accent2:   #d4a843;
    --red:       #e05c5c;
    --orange:    #d97706;
    --blue:      #5b9bd5;
    --farm:      #6db87a;
    --haus:      #a78bfa;
    --angest:    #f59e0b;
    --allg:      #60a5fa;
    --arbeit:    #f472b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* LOGIN */
  #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 48px 40px; width: 360px; text-align: center; }
  .login-box h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--accent); margin-bottom: 6px; }
  .login-box p { color: var(--muted); font-size: .85rem; margin-bottom: 28px; }
  .login-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 1rem; text-align: center; letter-spacing: 4px; margin-bottom: 12px; outline: none; }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button { width: 100%; background: var(--accent); color: #0f1410; border: none; border-radius: 8px; padding: 12px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: .95rem; cursor: pointer; }
  .login-error { color: var(--red); font-size: .82rem; margin-top: 10px; }

  /* HEADER */
  #app { display: none; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .farm-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent); }
  .header-meta { font-size: .75rem; color: var(--muted); }
  .stale-banner { background: #3d1f1f; color: var(--red); border: 1px solid #5a2d2d; border-radius: 6px; padding: 4px 12px; font-size: .78rem; display: none; }
  .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 6px 14px; font-size: .78rem; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  /* MAIN */
  .main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
  .grid-full { margin-bottom: 20px; }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .card-body { padding: 16px 20px; }

  /* TABS */
  .tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 7px; border: none; border-radius: 6px; background: transparent; color: var(--muted); font-family: 'IBM Plex Sans', sans-serif; font-size: .8rem; font-weight: 500; cursor: pointer; transition: all .15s; }
  .tab.active { background: var(--surface); color: var(--text); }

  /* TASKS */
  .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .task-item:last-child { border-bottom: none; }
  .prio-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .prio-1 { background: var(--red); }
  .prio-2 { background: var(--orange); }
  .prio-3 { background: var(--accent2); }
  .prio-4 { background: var(--muted); }
  .prio-5 { background: #444; }
  .task-title { font-size: .88rem; line-height: 1.4; flex: 1; }
  .task-meta { font-size: .72rem; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .kat-chip { font-size: .68rem; padding: 1px 7px; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; }
  .kat-allgemein { background: #1a2d4a; color: var(--allg); }
  .kat-wohnhaus { background: #2d1f4a; color: var(--haus); }
  .kat-garten { background: #1a3d1f; color: var(--farm); }
  .kat-default { background: #2a2a2a; color: var(--muted); }

  /* STATUS */
  .status-chip { font-size: .72rem; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
  .status-ok { background: #1a3d1f; color: var(--accent); }
  .status-bald_faellig { background: #3d2a0f; color: var(--orange); }
  .status-ueberfaellig { background: #3d1f1f; color: var(--red); }

  /* MACHINES */
  .machine-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .machine-item:last-child { border-bottom: none; }
  .machine-name { font-size: .88rem; font-weight: 500; }
  .machine-sub { font-size: .72rem; color: var(--muted); margin-top: 2px; }

  /* WEATHER */
  .weather-current { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .weather-stat { background: var(--bg); border-radius: 8px; padding: 12px; text-align: center; }
  .weather-val { font-size: 1.4rem; font-weight: 600; font-family: 'IBM Plex Mono', monospace; color: var(--accent); }
  .weather-lbl { font-size: .7rem; color: var(--muted); margin-top: 2px; }
  .forecast-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .forecast-day { background: var(--bg); border-radius: 8px; padding: 10px 6px; text-align: center; }
  .forecast-day .day-name { font-size: .7rem; color: var(--muted); margin-bottom: 4px; }
  .forecast-day .day-icon { font-size: 1.2rem; margin-bottom: 4px; }
  .forecast-day .day-max { font-size: .88rem; font-weight: 600; color: var(--accent2); }
  .forecast-day .day-min { font-size: .75rem; color: var(--muted); }
  .forecast-day .day-rain { font-size: .7rem; color: var(--blue); margin-top: 3px; }

  /* IRRIGATION */
  .irr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .irr-item { background: var(--bg); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; }
  .irr-name { font-size: .82rem; }
  .irr-date { font-size: .7rem; color: var(--muted); }

  /* HUNDE */
  .dog-card { background: var(--bg); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .dog-card:last-child { margin-bottom: 0; }
  .dog-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .dog-name { font-size: 1rem; font-weight: 600; }
  .dog-meta { font-size: .75rem; color: var(--muted); margin-bottom: 10px; }
  .dog-next { font-size: .78rem; color: var(--accent2); margin-bottom: 10px; }
  .behandlung-table { width: 100%; border-collapse: collapse; font-size: .75rem; }
  .behandlung-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .behandlung-table td { padding: 6px 8px; border-bottom: 1px solid #1a2a1d; }
  .behandlung-table tr:last-child td { border-bottom: none; }
  .no-behandlung { color: var(--muted); font-size: .8rem; font-style: italic; }

  /* KALENDER */
  .kal-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .kal-item:last-child { border-bottom: none; }
  .kal-title { font-size: .85rem; flex: 1; }

  /* JAHRESPLANUNG — Tabs */
  .jp-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .jp-btn {
    padding: 6px 14px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: .82rem;
    font-family: 'IBM Plex Sans', sans-serif;
    transition: all .2s;
  }
  .jp-btn:hover { border-color: var(--accent); color: var(--accent); }
  .jp-btn.active { background: var(--accent); color: #0f1410; border-color: var(--accent); font-weight: 600; }

  /* JAHRESPLANUNG — KW-Grid-Tabelle */
  .jp-kw-wrap { overflow-x: auto; }
  .jp-kw-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .8rem;
    min-width: 640px;
  }
  .jp-kw-table thead th {
    padding: 8px 12px;
    text-align: left;
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    background: var(--bg);
    border-bottom: 2px solid var(--border);
  }
  .jp-kw-table thead th.jp-th-kw {
    width: 120px;
    min-width: 110px;
  }
  /* Farbige obere Linie pro Kategorie-Spalte */
  .jp-kw-table thead th.col-prog   { border-top: 3px solid var(--allg); }
  .jp-kw-table thead th.col-rinder { border-top: 3px solid var(--farm); }
  .jp-kw-table thead th.col-weide  { border-top: 3px solid var(--haus); }
  .jp-kw-table thead th.col-haus   { border-top: 3px solid var(--angest); }

  .jp-kw-row td {
    padding: 8px 10px;
    vertical-align: top;
    border-bottom: 1px solid var(--border);
  }
  .jp-kw-row:last-child td { border-bottom: none; }
  .jp-kw-row:hover { background: rgba(255,255,255,0.02); }

  /* Aktuelle KW */
  .jp-kw-row.current-kw { background: rgba(91,155,213,0.08); }
  .jp-kw-row.current-kw .jp-kw-label-td { border-left: 3px solid var(--blue); }

  /* Linke Spalte: KW-Label */
  .jp-kw-label-td {
    white-space: nowrap;
    padding: 8px 12px;
    vertical-align: top;
    border-bottom: 1px solid var(--border);
  }
  .jp-kw-num {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: .82rem;
    color: var(--text);
    margin-bottom: 2px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .jp-kw-range {
    font-size: .7rem;
    color: var(--muted);
  }
  .kw-heute-badge {
    font-size: .62rem;
    background: var(--blue);
    color: #fff;
    border-radius: 4px;
    padding: 1px 5px;
    font-weight: 600;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  /* Kategorie-Zellen: farbiger Links-Balken */
  .jp-kw-cell {
    vertical-align: top;
    border-bottom: 1px solid var(--border);
    padding: 6px 10px 6px 12px;
  }
  .jp-kw-cell.col-prog   { border-left: 3px solid var(--allg);   }
  .jp-kw-cell.col-rinder { border-left: 3px solid var(--farm);   }
  .jp-kw-cell.col-weide  { border-left: 3px solid var(--haus);   }
  .jp-kw-cell.col-haus   { border-left: 3px solid var(--angest); }

  /* Eintrag in einer Zelle */
  .jp-cell-entry {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    line-height: 1.3;
  }
  .jp-cell-entry:last-child { border-bottom: none; }
  .jp-cell-title { flex: 1; color: var(--text); font-size: .78rem; }
  .jp-cell-date {
    font-size: .68rem;
    color: var(--muted);
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
    flex-shrink: 0;
  }

  /* Monatsübersicht-Zeile (Einträge ohne KW-Zuweisung) */
  .jp-kw-row.month-row td { background: rgba(255,255,255,0.015); }
  .jp-month-label {
    font-size: .72rem;
    color: var(--muted);
    font-style: italic;
  }

  /* EMPTY */
  .empty { color: var(--muted); font-size: .82rem; padding: 12px 0; }

  /* MOBILE */
  @media (max-width: 768px) {
    .header { padding: 12px 16px; }
    .farm-title { font-size: 1.1rem; }
    .main { padding: 12px; }
    .weather-current { grid-template-columns: repeat(2, 1fr); }
    .forecast-grid { grid-template-columns: repeat(4, 1fr); }
    .irr-grid { grid-template-columns: repeat(2, 1fr); }
    .behandlung-table { display: block; overflow-x: auto; }
    .header-meta { display: none; }
    [style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }
    .jp-tabs { justify-content: center; }
  }
  @media (max-width: 480px) {
    .forecast-grid { grid-template-columns: repeat(3, 1fr); }
    .irr-grid { grid-template-columns: 1fr 1fr; }
    .weather-current { grid-template-columns: repeat(2, 1fr); }
    .login-box { width: 90%; padding: 32px 24px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div style="font-size:2rem;margin-bottom:12px">🌿</div>
    <h1>Erichsfelde</h1>
    <p>Farm Manager Dashboard</p>
    <input type="password" id="pw-input" placeholder="Passwort" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Anmelden</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div style="display:flex;align-items:center;gap:16px">
      <div class="farm-title">🌿 Erichsfelde</div>
      <div class="header-meta" id="export-time">—</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="stale-banner" id="stale-banner">⚠ Daten veraltet</div>
      <button class="logout-btn" onclick="doLogout()">Abmelden</button>
    </div>
  </div>

  <div class="main">

    <!-- ROW 1: Aufgaben + Wetter/Maschinen/Tiere -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;align-items:start">

      <!-- LINKS: Aufgaben -->
      <div class="card">
        <div class="card-header"><span class="card-title">📋 Aufgaben</span></div>
        <div class="card-body">
          <div class="tabs">
            <button class="tab active" onclick="switchTab('heute')">Heute</button>
            <button class="tab" onclick="switchTab('7tage')">Nächste 7 Tage</button>
          </div>
          <div id="tasks-heute"></div>
          <div id="tasks-7tage" style="display:none"></div>
        </div>
      </div>

      <!-- RECHTS: Wetter + Windmotoren + Fahrzeuge + Bewässerung + Hunde -->
      <div style="display:flex;flex-direction:column;gap:16px">

        <div class="card">
          <div class="card-header"><span class="card-title">🌤 Wetter — Erichsfelde</span></div>
          <div class="card-body">
            <div class="weather-current" id="weather-current"></div>
            <div style="font-size:.75rem;color:var(--muted);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em">7-Tage Vorhersage</div>
            <div class="forecast-grid" id="forecast-grid"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">💨 Windmotoren</span></div>
          <div class="card-body" id="windmotoren-body"></div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">🚗 Fahrzeuge</span></div>
          <div class="card-body" id="fahrzeuge-body"></div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">💧 Bewässerung</span></div>
          <div class="card-body" id="bewaesserung-body"></div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">🐕 Hunde</span></div>
          <div class="card-body" id="hunde-body"></div>
        </div>

      </div>
    </div>

    <!-- ROW 2: Kalender -->
    <div class="grid-full">
      <div class="card">
        <div class="card-header"><span class="card-title">📅 Kalender — Nächste 30 Tage</span></div>
        <div class="card-body" id="kalender-body"></div>
      </div>
    </div>

    <!-- ROW 3: Jahresplanung -->
    <div class="grid-full">
      <div class="card">
        <div class="card-header"><span class="card-title">📆 Jahresplanung</span></div>
        <div class="card-body">
          <div class="jp-tabs" id="jp-tabs"></div>
          <div class="jp-kw-wrap" id="jp-kw-wrap"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/gitnamelast/farm-dashboard/main/data/dashboard.json';
const APP_VERSION = 'v2.3';
let dashData = null;

// ===== AUTH =====
async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  if (!pw) return;
  const hash = await sha256(pw);
  if (!dashData) { document.getElementById('login-error').textContent = 'Daten werden geladen…'; return; }
  if (hash === dashData.passwort_hash) { localStorage.setItem('eri_auth', hash); showApp(); }
  else { document.getElementById('login-error').textContent = 'Falsches Passwort'; }
}
function doLogout() { localStorage.removeItem('eri_auth'); location.reload(); }
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderAll();
}
async function loadData() {
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    dashData = await r.json();
  } catch(e) {
    document.getElementById('login-error').textContent = 'Verbindungsfehler — bitte später versuchen';
    return;
  }
  const saved = localStorage.getItem('eri_auth');
  if (saved && saved === dashData.passwort_hash) showApp();
}

// ===== RENDER ALL =====
function renderAll() {
  renderHeader();
  renderTasks();
  renderWetter();
  renderWindmotoren();
  renderFahrzeuge();
  renderBewaesserung();
  renderHunde();
  renderKalender();
  renderJahresplanung();
}

// ===== HEADER =====
function renderHeader() {
  const exp = dashData.exportiert_am;
  const d = new Date(exp);
  const fmt = d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  document.getElementById('export-time').textContent = 'Stand: ' + fmt + ' · ' + APP_VERSION;
  const diffH = (Date.now() - d.getTime()) / 3600000;
  if (diffH > 24) {
    const banner = document.getElementById('stale-banner');
    banner.style.display = 'block';
    banner.textContent = '⚠ Daten veraltet — letzter Stand vor ' + Math.round(diffH) + ' Stunden';
  }
}

// ===== HELPERS =====
function katClass(k) {
  const m = {allgemein:'kat-allgemein',wohnhaus:'kat-wohnhaus',garten:'kat-garten'};
  return m[k] || 'kat-default';
}
function katLabel(k) {
  const m = {allgemein:'Allgemein',wohnhaus:'Haus & Hof',garten:'Garten',rinder:'Rinder',schafe:'Schafe',hunde:'Hunde',weide:'Weide',ernte:'Ernte',buschkontrolle:'Buschkontrolle',boreholes:'Boreholes',pumpen:'Pumpen',tanks:'Tanks',traenken:'Tränken',bewaesserung:'Bewässerung',fahrzeuge:'Fahrzeuge',traktoren:'Traktoren',windmotoren:'Windmotoren',generatoren:'Generatoren',sonstige_maschinen:'Sonstige',zaun:'Zaun',gebaeude:'Gebäude',elektrik:'Elektrik',solar:'Solar',werkstatt:'Werkstatt',strassen:'Straßen',haustiere:'Haustiere'};
  return m[k] || k || '—';
}
function besitzerLabel(b) { return b==='werner'?'Werner':b==='wanda'?'Wanda':'Gemeinsam'; }
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s+'T00:00:00');
  return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== TASKS =====
function taskHtml(tasks) {
  if (!tasks || !tasks.length) return '<div class="empty">Keine Aufgaben</div>';
  let html = tasks.slice(0,20).map(t => `
    <div class="task-item">
      <div class="prio-dot prio-${t.prioritaet}"></div>
      <div style="flex:1">
        <div class="task-title">${esc(t.titel)}</div>
        <div class="task-meta">
          <span class="kat-chip ${katClass(t.kategorie)}">${katLabel(t.kategorie)}</span>
          <span>${fmtDate(t.faellig)}</span>
          <span>${besitzerLabel(t.besitzer)}</span>
        </div>
        ${t.beschreibung ? `<div style="font-size:.75rem;color:var(--muted);margin-top:3px">${esc(t.beschreibung)}</div>` : ''}
      </div>
    </div>`).join('');

// ===== JAHRESPLANUNG =====

const MONTHS = [
  {key:'januar',label:'Januar'},{key:'februar',label:'Februar'},{key:'maerz',label:'März'},
  {key:'april',label:'April'},{key:'mai',label:'Mai'},{key:'juni',label:'Juni'},
  {key:'juli',label:'Juli'},{key:'august',label:'August'},{key:'september',label:'September'},
  {key:'oktober',label:'Oktober'},{key:'november',label:'November'},{key:'dezember',label:'Dezember'}
];
const MONTH_IDX = {januar:0,februar:1,maerz:2,april:3,mai:4,juni:5,juli:6,august:7,september:8,oktober:9,november:10,dezember:11};
const DE_MONTHS_SHORT = ['Jan','Feb','März','Apr','Mai','Juni','Juli','Aug','Sept','Okt','Nov','Dez'];

let activeMonth = MONTHS[new Date().getMonth()].key;

// ISO-Kalenderwoche berechnen
function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);
  const w1 = new Date(d.getFullYear(),0,4);
  return 1 + Math.round(((d-w1)/86400000 - 3 + (w1.getDay()+6)%7)/7);
}

// Alle KWs ermitteln, die einen Monat überlappen
function getKWsForMonth(year, monthIdx) {
  const weeks = [];
  const firstDay = new Date(year, monthIdx, 1);
  const lastDay  = new Date(year, monthIdx+1, 0);
  let cur = new Date(firstDay);
  const dow = cur.getDay();
  cur.setDate(cur.getDate() - (dow===0 ? 6 : dow-1));
  while (cur <= lastDay) {
    const start = new Date(cur);
    const end   = new Date(cur); end.setDate(end.getDate()+6);
    weeks.push({ kw: getISOWeek(start), start, end });
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}

function fmtDateRange(start, end) {
  return start.getDate()+'.–'+end.getDate()+'. '+DE_MONTHS_SHORT[end.getMonth()];
}
function fmtCellDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
}
function isCurrentKW(week) {
  const today = new Date();
  return today >= week.start && today <= week.end;
}
function isoStr(d) { return d.toISOString().slice(0,10); }

function renderJahresplanung() {
  const jp = dashData.jahresplanung;
  if (!jp) {
    document.getElementById('jp-kw-wrap').innerHTML = '<div class="empty">Keine Jahresplanung im Export vorhanden.</div>';
    return;
  }

  // Kalender-Lookup: normalisierter Titel → Datum
  const kalLookup = {};
  function normTitel(s) { return (s || '').trim().toLowerCase(); }
  (dashData.kalender || []).forEach(function(e) {
    if (e.datum && e.titel) kalLookup[normTitel(e.titel)] = e.datum;
  });
  // Auch aus Aufgaben-Listen (heute + 7 Tage)
  ['heute', 'naechste_7_tage'].forEach(function(key) {
    (((dashData.aufgaben || {})[key]) || []).forEach(function(t) {
      var d = t.faellig || t.due_date || '';
      if (d && t.titel) kalLookup[normTitel(t.titel)] = d;
    });
  });

  // Jahresplanung-Einträge ohne Datum anreichern
  Object.values(jp).forEach(function(monat) {
    ['jahresprogramm','rinder','weide','haus_hof'].forEach(function(cat) {
      (monat[cat] || []).forEach(function(item) {
        if (!item.datum) {
          var found = kalLookup[normTitel(item.titel)];
          if (found) item.datum = found;
        }
      });
    });
  });

  window._jpData = jp;
  document.getElementById('jp-tabs').innerHTML = MONTHS.map(m =>
    '<button class="jp-btn' + (m.key===activeMonth?' active':'') + '" onclick="selectMonth(\'' + m.key + '\')">' + m.label + '</button>'
  ).join('');
  renderKWGrid(jp, activeMonth);
}

function selectMonth(key) {
  activeMonth = key;
  document.querySelectorAll('.jp-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === MONTHS.find(m=>m.key===key).label);
  });
  if (window._jpData) renderKWGrid(window._jpData, key);
}

function renderKWGrid(jp, key) {
  const m     = jp[key] || {};
  const year  = new Date().getFullYear();
  const weeks = getKWsForMonth(year, MONTH_IDX[key]);

  const cols = [
    {key:'jahresprogramm', label:'Jahresprogramm', cls:'col-prog'},
    {key:'rinder',         label:'Rinder',         cls:'col-rinder'},
    {key:'weide',          label:'Weide',           cls:'col-weide'},
    {key:'haus_hof',       label:'Haus & Hof',      cls:'col-haus'}
  ];

  const byDate = {};
  const noDate = {};
  cols.forEach(c => { noDate[c.key] = []; });
  cols.forEach(c => {
    (m[c.key] || []).forEach(item => {
      if (item.datum) {
        if (!byDate[item.datum]) byDate[item.datum] = {};
        if (!byDate[item.datum][c.key]) byDate[item.datum][c.key] = [];
        byDate[item.datum][c.key].push(item);
      } else {
        noDate[c.key].push(item);
      }
    });
  });

  function entriesForWeek(week, colKey, isFirst) {
    const list = [];
    const startS = isoStr(week.start), endS = isoStr(week.end);
    Object.entries(byDate).forEach(function(entry) {
      var datum = entry[0], cats = entry[1];
      if (datum >= startS && datum <= endS && cats[colKey])
        cats[colKey].forEach(function(i) { list.push(Object.assign({}, i, {_hasDatum:true})); });
    });
    if (isFirst) noDate[colKey].forEach(function(i) { list.push(Object.assign({}, i, {_hasDatum:false})); });
    return list;
  }

  var thCls = {col_prog:'col-prog',col_rinder:'col-rinder',col_weide:'col-weide',col_haus:'col-haus'};
  var html = '<table class="jp-kw-table"><thead><tr><th class="jp-th-kw">Woche</th>'
    + cols.map(function(c){ return '<th class="'+c.cls+'">'+c.label+'</th>'; }).join('')
    + '</tr></thead><tbody>';

  weeks.forEach(function(week, wi) {
    var isCurrent = isCurrentKW(week);
    var badge = isCurrent ? '<span class="kw-heute-badge">Heute</span>' : '';
    html += '<tr class="jp-kw-row' + (isCurrent ? ' current-kw' : '') + '">'
      + '<td class="jp-kw-label-td">'
      + '<div class="jp-kw-num">KW ' + String(week.kw).padStart(2,'0') + ' ' + badge + '</div>'
      + '<div class="jp-kw-range">' + fmtDateRange(week.start, week.end) + '</div>'
      + '</td>';
    cols.forEach(function(c) {
      var entries = entriesForWeek(week, c.key, wi===0);
      html += '<td class="jp-kw-cell ' + c.cls + '">';
      entries.forEach(function(item) {
        var ds = item._hasDatum ? fmtCellDate(item.datum) : '';
        html += '<div class="jp-cell-entry">'
          + '<span class="jp-cell-title">' + esc(item.titel) + '</span>'
          + (ds ? '<span class="jp-cell-date">' + ds + '</span>' : '')
          + '</div>';
      });
      html += '</td>';
    });
    html += '</tr>';
  });

  document.getElementById('jp-kw-wrap').innerHTML = html + '</tbody></table>';
}
